name: Daily Digest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  TZ: America/Los_Angeles

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily"
